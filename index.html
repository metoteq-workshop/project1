<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101322;
      color: #f7f7fb;
    }
    * { box-sizing: border-box; }
    .site-nav { position: fixed; z-index: 2; top: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(16,19,34,.62); backdrop-filter: blur(14px); }
    .site-nav a { padding: 9px 16px; border-radius: 999px; color: #b6b8c9; text-decoration: none; font-size: .88rem; transition: color .2s, background .2s; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.1); }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 90px 0 30px;
      background:
        radial-gradient(ellipse at 17% 18%, rgba(95, 82, 255, .22), transparent 34%),
        radial-gradient(ellipse at 83% 79%, rgba(32, 214, 190, .15), transparent 35%),
        #101322;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(1px); pointer-events: none; }
    .orb-one { width: 240px; height: 240px; top: -100px; right: 16%; background: linear-gradient(135deg, #8b5cf6, #4f46e5); opacity: .35; }
    .orb-two { width: 150px; height: 150px; bottom: -55px; left: 13%; background: linear-gradient(135deg, #2dd4bf, #0ea5e9); opacity: .28; }
    main {
      position: relative;
      width: min(680px, calc(100% - 40px));
      padding: clamp(38px, 8vw, 76px) clamp(28px, 8vw, 78px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: #b8b9cc; font-size: .76rem; letter-spacing: .18em; text-transform: uppercase; }
    .spark { width: 7px; height: 7px; border-radius: 50%; background: #59e1c6; box-shadow: 0 0 14px #59e1c6; }
    h1 { margin: 25px 0 14px; font-size: clamp(3.2rem, 10vw, 6.2rem); line-height: .98; letter-spacing: -.075em; font-weight: 760; }
    h1 span { display: block; color: transparent; background: linear-gradient(100deg, #9c8aff 5%, #7dd3fc 52%, #6ee7c2 100%); background-clip: text; -webkit-background-clip: text; }
    p { max-width: 410px; margin: 0 auto; color: #b6b8c9; font-size: clamp(1rem, 2.5vw, 1.12rem); line-height: 1.7; }
    button { margin-top: 34px; padding: 13px 21px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; color: #fff; background: rgba(255,255,255,.09); font: inherit; cursor: pointer; transition: transform .2s, background .2s, border-color .2s; }
    button:hover { transform: translateY(-2px); background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.35); }
    button:focus-visible { outline: 2px solid #77e5cf; outline-offset: 4px; }
    .footer { margin-top: 30px; color: #777b91; font-size: .78rem; letter-spacing: .04em; }
    @keyframes arrive { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="eyebrow"><span class="spark" aria-hidden="true"></span> A little something to start</div>
    <h1>Hello,<span>World!</span></h1>
    <p>Every great idea begins with a first line. Here's to making this one count.</p>
    <button type="button" id="hello-button">Say hello <span aria-hidden="true">↗</span></button>
    <div class="footer" id="message" aria-live="polite">Made with a little bit of magic.</div>
  </main>
  <script>
    const button = document.querySelector('#hello-button');
    const message = document.querySelector('#message');
    button.addEventListener('click', () => {
      message.textContent = 'Hello right back at you ✨';
      button.textContent = 'Hello! ✓';
    });
  </script>
</body>
</html>
