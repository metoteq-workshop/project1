<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <title>Contact — Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101322; color: #f7f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 100px 20px 40px; background: radial-gradient(ellipse at 17% 18%,rgba(95,82,255,.22),transparent 34%),radial-gradient(ellipse at 83% 79%,rgba(32,214,190,.15),transparent 35%),#101322; }
    .orb { position:fixed; border-radius:50%; pointer-events:none; }
    .orb-one { width:240px;height:240px;top:-100px;right:16%;background:linear-gradient(135deg,#8b5cf6,#4f46e5);opacity:.3; }
    .orb-two { width:150px;height:150px;bottom:-55px;left:13%;background:linear-gradient(135deg,#2dd4bf,#0ea5e9);opacity:.25; }
    .site-nav { position:fixed;z-index:2;top:24px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(16,19,34,.62);backdrop-filter:blur(14px); }
    .site-nav a { padding:9px 16px;border-radius:999px;color:#b6b8c9;text-decoration:none;font-size:.88rem;transition:color .2s,background .2s; }
    .site-nav a:hover,.site-nav a[aria-current="page"] { color:#fff;background:rgba(255,255,255,.1); }
    main { position:relative;width:min(760px,100%);padding:clamp(32px,6vw,60px);border:1px solid rgba(255,255,255,.13);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));box-shadow:0 30px 100px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(18px);animation:arrive .7s ease both; }
    .eyebrow { display:inline-flex;align-items:center;gap:9px;color:#b8b9cc;font-size:.76rem;letter-spacing:.18em;text-transform:uppercase; }
    .spark { width:7px;height:7px;border-radius:50%;background:#59e1c6;box-shadow:0 0 14px #59e1c6; }
    h1 { margin:22px 0 14px;font-size:clamp(3rem,9vw,5.5rem);line-height:1;letter-spacing:-.075em; }
    h1 span { display:block;color:transparent;background:linear-gradient(100deg,#9c8aff 5%,#7dd3fc 52%,#6ee7c2 100%);background-clip:text;-webkit-background-clip:text; }
    .intro { max-width:530px;color:#b6b8c9;font-size:1.06rem;line-height:1.75; }
    form { display:grid;gap:16px;margin-top:28px; }
    .fields { display:grid;grid-template-columns:1fr 1fr;gap:14px; }
    label { display:grid;gap:8px;color:#d6d7e2;font-size:.88rem; }
    input,textarea { width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.13);border-radius:12px;color:#f7f7fb;background:rgba(9,11,22,.42);font:inherit; }
    input::placeholder,textarea::placeholder { color:#777b91; }
    input:focus,textarea:focus { outline:2px solid rgba(110,231,194,.7);outline-offset:2px; }
    textarea { min-height:130px;resize:vertical; }
    button { justify-self:start;padding:13px 20px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:#fff;background:linear-gradient(100deg,rgba(124,104,255,.7),rgba(46,201,181,.55));font:inherit;cursor:pointer;transition:transform .2s,filter .2s; }
    button:hover { transform:translateY(-2px);filter:brightness(1.12); }
    button:focus-visible { outline:2px solid #77e5cf;outline-offset:4px; }
    .note { margin:0;color:#85899f;font-size:.8rem;line-height:1.5; }
    #status { min-height:1.5em;margin:0;color:#83e7c9;font-size:.9rem; }
    @keyframes arrive { from { opacity:0;transform:translateY(14px); } to { opacity:1;transform:translateY(0); } }
    @media(max-width:560px) { .fields { grid-template-columns:1fr; }.site-nav { top:16px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important;transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div class="orb orb-one" aria-hidden="true"></div><div class="orb orb-two" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <div class="eyebrow"><span class="spark" aria-hidden="true"></span> We'd love to hear from you</div>
    <h1>Say hello.<span>Start a conversation.</span></h1>
    <p class="intro">Have a question, an idea, or just want to say hi? Leave a note below and we’ll be glad you did.</p>
    <form id="contact-form" action="api/contact.php" method="post">
      <div class="fields">
        <label for="name">Your name<input id="name" name="name" autocomplete="name" placeholder="Ada Lovelace" required></label>
        <label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" placeholder="ada@example.com" required></label>
      </div>
      <label for="message">Your message<textarea id="message" name="message" placeholder="What's on your mind?" required></textarea></label>
      <button type="submit">Send a note <span aria-hidden="true">↗</span></button>
      <p class="note">This is a demo contact form and isn’t connected to a message service yet.</p>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#contact-form');
    const status = document.querySelector('#status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      status.textContent = 'Sending...';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' },
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Your message could not be sent.');
        }

        status.textContent = result.message;
        form.reset();
      } catch (error) {
        status.textContent = error.message || 'Unable to reach the server. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
